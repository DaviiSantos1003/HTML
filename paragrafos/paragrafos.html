<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Parágrafos </title>
</head>
<body>
    
<!-- -----------Tag de Parágrafo------------ -->
 <p> Isso é um parágrafo </p>
 <!-- ---------- Strong: Importância ---------- -->
 <p>Conheça o <Strong> Iphone 18 </Strong> </p>

<!-- ---------- em: Ênfase ---------- -->
<p>Esse é um texto em <em> itálico </em></p>

<!-- ---------- u: sublinhado ---------- -->
<p> Exemplo de <u> texto sublinhado </u></p>

<!-- ---------- small: Pequeno ---------- -->
 Esse é um exemplo de <small> um texto Pequeno </small>

 <!-- ----------  ---------- -->


</body>
</html>
